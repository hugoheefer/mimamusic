<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiMaMusic</title>
  <meta name="robots" content="noindex">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #faf9f7;
    }
    iframe {
      border: 0;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    /* Shown only if the iframe fails to load / is blocked */
    .fallback {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #222;
      text-align: center;
      padding: 3rem 1rem;
    }
    .fallback a { color: #0a58ca; }
  </style>
</head>
<body>
  <div class="fallback">
    <p>MiMaMusic laadt&hellip;
       Werkt het niet? <a href="https://hugoheefer.github.io/mimamusic/">Klik hier</a>.</p>
  </div>
  <iframe
    src="https://hugoheefer.github.io/mimamusic/"
    title="MiMaMusic"
    allow="fullscreen; autoplay; encrypted-media"
    referrerpolicy="no-referrer-when-downgrade"></iframe>
</body>
</html>
