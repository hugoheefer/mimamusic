# GitHub Pages deploy for the MiMaMusic site (Eleventy project in maintainable_website/).
#
# One-time setup on GitHub:
#   1. Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
#   2. Settings -> Environments -> github-pages -> "Deployment branches and tags":
#      by default only the DEFAULT branch may deploy. To deploy from the feature
#      branch below, add it here (or choose "No restriction").
#   3. GitHub Pages serves PUBLIC repos free; a private repo needs GitHub Pro
#      (~EUR 4/mo). The repo being private is what paused the earlier Pages test.
#
# The `feature/...` line lets the branch be previewed before merging to master;
# remove it once the work is on master. When maintainable_website/ is promoted to
# the repo root, drop the `paths:` filter, `working-directory:` and the path
# prefixes below.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [master, main, feature/build-mainainable-site]
    paths: ["maintainable_website/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maintainable_website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: maintainable_website/package-lock.json
      - run: npm ci
      - uses: actions/configure-pages@v6

      # A GitHub Pages *project* site is served from <owner>.github.io/<repo>/ ,
      # so links need the /<repo>/ prefix. Derived from the repo name, so this
      # workflow works unchanged in any repo. For a custom domain served at the
      # root, replace the line below with:  echo "PATH_PREFIX=/" >> "$GITHUB_ENV"
      - name: Compute Pages base path
        run: echo "PATH_PREFIX=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      # 1) build for GitHub Pages (absolute links, prefixed with PATH_PREFIX)
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: maintainable_website/_site
      # exact copy of what is deployed (links assume the /<repo>/ path)
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: maintainable_website/_site
          retention-days: 90

      # 2) rebuild with relative links — this copy runs from anywhere (file://,
      #    any web server's webroot, any subfolder). Download this one to reuse
      #    the site elsewhere:  Actions -> a run -> Artifacts -> site-portable.
      - run: npm run build:portable
      - uses: actions/upload-artifact@v7
        with:
          name: site-portable
          path: maintainable_website/_site
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
